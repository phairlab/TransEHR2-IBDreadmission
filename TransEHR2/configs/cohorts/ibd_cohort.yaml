# IBD cohort eligibility, the CD/UC/IBDU classification and the readmission
# label's exclusions, read by IBDdataprep's ibd_eligibility.py and
# build_labels.py.

# Every date comparison is between local calendar dates. Timestamps are stored
# in UTC, and a date-only field was set to 23:59 (or 00:00) local before
# conversion, so converting back recovers the date the raw table wrote.
LOCAL_TIMEZONE: America/Edmonton

# The Crohn's disease (CD) and ulcerative colitis (UC) code prefixes per
# source, compared with dots removed and in upper case: ICD-10-CA for AMB and
# DAD, ICD-9 for CLM (quoted so they stay text). Eligibility uses both groups,
# classification tells them apart.
IBD_CODES:
  AMB: {CD: [K50], UC: [K51]}
  DAD: {CD: [K50], UC: [K51]}
  CLM: {CD: ["555"], UC: ["556"]}

# ---------------------------------------------------------------------------
# Eligibility (ibd_eligibility.py), swept over the normalized AMB, DAD and CLM
# tables.
#
# A record qualifies when any of its diagnosis codes is in IBD_CODES. Each
# date scores the largest POINTS among the sources qualifying on it, so
# qualifying AMB and DAD records on one date score 1 together and qualifying
# claims on one date score 0.5 together. A DAD stay qualifies on its
# discharge date, where its diagnoses are coded.
#
# A claim date scores nothing when it falls on the arrival date of a
# qualifying AMB visit or anywhere from admission to discharge (inclusive) of
# a qualifying DAD stay: that encounter is already counted. A coinciding
# record without a qualifying code does not cancel it.
#
# A patient reaches a threshold on the first date d where the dates e with
# d - e <= WINDOW_DAYS days score at least that much in total.
# EVIDENCE_THRESHOLD dates the first evidence of IBD, ELIGIBILITY_THRESHOLD
# the training cohort's eligibility; both hold forever once reached.
# ---------------------------------------------------------------------------
ELIGIBILITY:
  POINTS: {AMB: 1, DAD: 1, CLM: 0.5}
  WINDOW_DAYS: 730
  EVIDENCE_THRESHOLD: 1
  ELIGIBILITY_THRESHOLD: 2

# ---------------------------------------------------------------------------
# CD / UC / IBDU classification (ibd_eligibility.py), per patient over their
# whole record. It stratifies the analysis and has no part in eligibility.
# Rezaie et al., Inflamm Bowel Dis 2012, Table 5 (0.4PC+aCCS+DaD):
#
#   SCORE = sum over sources of WEIGHTS * (UC-coded records - CD-coded records)
#   SCORE < CD_THRESHOLD is CD, SCORE > UC_THRESHOLD is UC, otherwise IBDU.
#
# Every record counts, dated or not and whatever the eligibility rule made
# of it; a record with both a CD and a UC code counts toward both.
# ---------------------------------------------------------------------------
CLASSIFICATION:
  WEIGHTS: {AMB: 1.0, DAD: 1.0, CLM: 0.4}
  CD_THRESHOLD: -2
  UC_THRESHOLD: 2

# ---------------------------------------------------------------------------
# Readmission exclusions (build_labels.py). A DAD stay matching any rule is
# struck from the readmission candidates: it does not count as a readmission,
# and an episode whose next unplanned admission it is races on to whatever
# comes after it. Rules are read off the stay's DX_CODES, DX_TYPES and DISP in
# stays.csv.
#
# A rule matches a stay when one of its diagnoses
#   - starts with one of `codes`,
#   - starts with none of `except` (if given),
#   - has a diagnosis type in `dx_types` (if given; M = most responsible), and
#   - has its 6th character in `sixth_character` (if given),
# or when its discharge disposition is one of `dispositions`. Dispositions are
# compared zero-padded to two digits, so "7" and "07" are the same.
#
# The mental illness, palliative, MAID, chemotherapy and delivery rules follow
# the CIHI readmission indicator as ibd-patient-cohort-definition implements
# it (config/default.yaml, readmission.cihi.exclusions). Mental illness is
# CIHI's MCC 17, which the extract does not carry; a chapter F most
# responsible diagnosis approximates it.
# ---------------------------------------------------------------------------
READMISSION_EXCLUSIONS:
  # ICD-10-CA chapter XX (V00-Y99) in any position, less the blocks naming a
  # treatment as the cause: Y40-Y59 (drugs in therapeutic use) and Y83-Y84
  # (procedures). Decided 2026-10-07.
  external_cause:
    codes: [V, W, X, Y]
    except: [Y4, Y5, Y83, Y84]
  mental_illness:
    codes: [F]
    dx_types: [M]
  palliative:
    codes: [Z515]
    dx_types: [M]
  chemotherapy:
    codes: [Z511]
    dx_types: [M, "1", C, W, X, Y]
  # Obstetric codes whose 6th character is 1 or 2 (delivered), and Z37
  # (outcome of delivery) in any position.
  delivery:
    codes: [O10, O11, O12, O13, O14, O15, O16, O21, O22, O23, O24, O25, O26,
            O27, O28, O29, O30, O31, O32, O33, O34, O35, O36, O37, O40, O41,
            O42, O43, O44, O45, O46, O48, O60, O61, O62, O63, O64, O65, O66,
            O67, O68, O69, O70, O71, O72, O73, O74, O75, O85, O86, O87, O88,
            O89, O90, O91, O92, O95, O98, O99]
    sixth_character: ["1", "2"]
  delivery_outcome:
    codes: [Z37]
  maid:
    dispositions: ["73"]

# ---------------------------------------------------------------------------
# Label sets (user, 2026-11-22): alternative labellings built beside the
# current labels, never over them. Each entry replaces the top-level keys it
# names (READMISSION_EXCLUSIONS), or adds EPISODE_OF_CARE, for
#     build_labels.py --label-set <name> --labels data/labelsets/<name>/labels.csv
# and IBDdataprep's label_set.py builds data/labelsets/<name>/ around it: the
# same drawn episodes, folds and input arrays as data/, with this set's
# targets (SLURM/slurm_label_set.sh runs both). The current labels are the
# top-level rules above, untouched by any entry here.
# ---------------------------------------------------------------------------
LABEL_SETS:
  # Readmissions after an episode of care, AMB and DAD alike (settled
  # 2026-11-23; development/relabel_episode_of_care_spec_2026-11-23.md, and
  # IBDdataprep's episode_of_care.py, hold the rule). The readmission is the
  # first eligible encounter admitted after the index's episode of care ends;
  # this supersedes the 24 h floor. The clinical exclusions are the top-level
  # READMISSION_EXCLUSIONS, applied to AMB as well: on its codes alone, with
  # DXCODE1 as the most responsible diagnosis (type M), and never through a
  # rule's dispositions, which are DAD codes. Built on the stays tree
  # IBDdataprep's labelset_stays.py writes (SLURM/slurm_labelset_stays.sh).
  post_index_episode_of_care_relabel:
    EPISODE_OF_CARE:
      # When a member X's links close, in hours, after the Episodes of Care
      # section of CIHI's General Methodology Notes. An encounter admitted by
      # W1 links unconditionally; one admitted by W2 links on a transfer
      # pairing (INST to INSTFROM, INSTTO to INST, or INSTTO to INSTFROM) or a
      # transfer disposition below. Every member's windows run from its
      # discharge. A member whose discharge has no recorded time -- every AMB
      # visit, and a DAD stay without DISTIME, both set to 23:59 local --
      # takes the later of that and its ADMISSION windows, since 23:59 can
      # fall after the receiving admission in a transfer.
      WINDOW_HOURS:
        DISCHARGE: {W1: 7, W2: 12}
        ADMISSION: {W1: 12, W2: 17}
      # X's discharge dispositions that link E by W2: X's codes, E's source
      # ("to", any if absent) and the INST test ("same" or "different"; any
      # if absent). Compared zero-padded to two digits. DAD 01's "another
      # facility" is a synopsis rather than the official wording, and no
      # pre-2018 code covers a same-facility transfer, so it takes any INST.
      TRANSFER_DISPOSITIONS:
        AMB:
          - {codes: ["06", "07"], to: DAD, inst: same}
          - {codes: ["08"], inst: different}
          - {codes: ["09"], to: DAD, inst: different}
          - {codes: ["12", "13", "14"], to: AMB, inst: same}
        DAD:
          - {codes: ["01", "10"], to: DAD}
          - {codes: ["20"], to: AMB}
      # A raw institution code the dictionary's RESIDENTIAL column does not
      # settle (no exact match, and the codes sharing its last three digits
      # disagree or none exists) is residential when it starts with one of
      # these (86 is an auxiliary hospital, 87 a nursing home). A residential
      # DAD stay is never a member of an episode of care (but as its index)
      # and never a readmission.
      RESIDENTIAL_PREFIXES: ["85", "86", "87"]
      # Readmission eligibility, per encounter; an ineligible one is skipped.
      # A DAD stay must also be non-residential, and either source must match
      # no clinical exclusion.
      ELIGIBLE:
        DAD_ADMITCAT: [U]
        # Urgent care and advanced ambulatory care (715140000, Community
        # Advanced Ambulatory Care, among them); never O.
        AMB_ABSTRACT_TYPE: [U, A]
        # Emergency department visits at these MIS codes only: 713100000
        # Emergency and 713102000 General Emergency.
        AMB_ABSTRACT_TYPE_BY_MIS_CODE:
          E: ["713100000", "713102000"]
      # AMB dispositions that strike a visit from the readmissions: 10 and 71
      # dead on arrival (before and from 2018), 73 MAID. DAD's MAID is the
      # maid rule above. Ambiguous codes are left out: AMB 11 and DAD 07,
      # "died, includes MAID" (pre-2018).
      AMB_DISPOSITION_EXCLUSIONS: ["10", "71", "73"]
