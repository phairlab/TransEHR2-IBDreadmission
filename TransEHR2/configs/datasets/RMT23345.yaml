# RMT23345 Dataset Configuration
# Configuration file for extracting and preprocessing the RMT23345 IBD
# readmission data. Together with variable_properties.yaml this is the
# single source of truth for feature names, types and dimensions: every
# array width is derived from the two files and never declared.
#
# The paths below are absolute and point at one particular machine. Edit
# them before the first run.

# Holds root/, labels.csv and fold{i}/ from IBDdataprep, plus
# extracted/ (extract_data.py) and lookup_tables/ (embed.py)
DATA_DIR: "/uhome/pr3/projects/p60290_2/TransEHR2-IBDreadmission/data"

# Path to variable properties YAML file
VARIABLE_PROPERTIES_PATH: "/uhome/pr3/projects/p60290_2/TransEHR2-IBDreadmission/data/ibd/variable_properties.yaml"

# ClinVec ATC vocabulary. CLINVEC_INDEX is a row of this file, so its row
# count V is the index unused drug slots are padded with, and
# drug_embeddings.npy is (V+1, 128). Read at extraction; the embeddings
# themselves are built by embed.py.
CLINVEC_PATH: "/uhome/pr3/projects/p60290_2/TransEHR2-IBDreadmission/data/resources/ClinVec_atc.csv"

