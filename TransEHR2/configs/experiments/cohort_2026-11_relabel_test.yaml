# TEMPORARY (user, 2026-11-24): a test of the relabel, TransEHR2-DeepHit
# fine-tuned on folds 1-5 under the label set
# post_index_episode_of_care_relabel, started from part1_transehr2's
# pretrained encoders. development/scripts/submit_relabel_test.sh queues it.
# part1_transehr2.yaml with these changes, and nothing else:
#   - EXPERIMENT_NAME is cohort_2026-11_relabel_test, so its models,
#     checkpoints and logs are new and nothing of part1_transehr2's is
#     written;
#   - PRETRAINED_FROM: part1_transehr2. Each fold copies that fold's
#     pretrained encoder; no pretraining runs;
#   - LABEL_SET: post_index_episode_of_care_relabel, so it refuses any
#     DATA_DIR but data/labelsets/post_index_episode_of_care_relabel.
# The ranking term is part1_transehr2's: DEEPHIT_RANK_WEIGHT 1 at the default
# DEEPHIT_SIGMA 0.1, unscaled and unrestricted. No tuning.
#
# The pretraining keys must equal part1_transehr2.yaml's for PRETRAINED_FROM,
# so RECORD_MASK_RATIO reads 0.25 here as it does there (2026-11-24).
# Finetuning never reads it; the encoders are whatever part1_transehr2's
# folds hold, and each copied fold's evaluation/evaluation_pretrained.yaml
# records the ratio they were pretrained at (the submit script prints it).

EXPERIMENT_NAME: cohort_2026-11_relabel_test
PRETRAINED_FROM: part1_transehr2
LABEL_SET: post_index_episode_of_care_relabel

BATCH_SIZE: 200
BRIER_INTEGRATION_DAYS: 30
CMPNT_MASK_RATIO: 0.5
DEEPHIT_CAUSE_WEIGHTS: null
DEEPHIT_HEAD_DROPOUT: 0.1
DEEPHIT_HEAD_D_CAUSE:
- 64
DEEPHIT_HEAD_D_SHARED:
- 256
- 128
DEEPHIT_RANK_WEIGHT: 1.0
DEEPHIT_SIGMA: 0.1
DISCRIMINATOR_DIM_FEEDFORWARD: 256
DISCRIMINATOR_ENCODER_ACTIVATION: gelu
DISCRIMINATOR_ENCODER_DIM_FEEDFORWARD: 256
DISCRIMINATOR_ENCODER_DROPOUT: 0.1
DISCRIMINATOR_ENCODER_D_MODEL: 256
DISCRIMINATOR_ENCODER_NORM: LayerNorm
DISCRIMINATOR_ENCODER_NORM_FIRST: true
DISCRIMINATOR_ENCODER_N_ENCODER_BLOCKS: 1
DISCRIMINATOR_ENCODER_N_HEADS: 2
DISC_LOSS_WEIGHT: 1.0
EVENT_LADDER_P_MAX: 379993.0
EVENT_LADDER_P_MIN: 0.00138889
FINETUNE_LEARNING_RATE: 1.0e-05
FINETUNE_LR_HALF_LIFE: 160
FINETUNE_SEED: 0
FINETUNE_SELECTION_METRIC: brier
FINETUNE_TOTAL_EPOCH: 500
GENERATOR_DIM_FEEDFORWARD: 256
GENERATOR_D_MODEL: 256
GENERATOR_ENCODER_ACTIVATION: gelu
GENERATOR_ENCODER_DIM_FEEDFORWARD: 256
GENERATOR_ENCODER_DROPOUT: 0.1
GENERATOR_ENCODER_D_MODEL: 256
GENERATOR_ENCODER_NORM: LayerNorm
GENERATOR_ENCODER_NORM_FIRST: true
GENERATOR_ENCODER_N_ENCODER_BLOCKS: 1
GENERATOR_ENCODER_N_HEADS: 2
MODELLED_CAUSES:
- readmission
- death
- out_migration
MODEL_DIR: /uhome/pr3/projects/p60290_2/TransEHR2-IBDreadmission/models
OBS_UNOBS_SAMPLE_RATIO: 10.0
POSITION_ENCODING: rope
PREDICTOR_AGGREGATION_METHOD: mean
PREDICT_INDICATORS: true
PRETRAIN_LEARNING_RATE: 0.0002
PRETRAIN_LR_HALF_LIFE: null
PRETRAIN_SEED: 0
PRETRAIN_TOTAL_EPOCH: 200
RECORD_MASK_RATIO: 0.25
THP_ENCODER_DROPOUT: 0.1
THP_ENCODER_D_INNER: 256
THP_ENCODER_D_K: 128
THP_ENCODER_D_MODEL: 256
THP_ENCODER_D_V: 64
THP_ENCODER_NORM_FIRST: true
THP_ENCODER_N_HEADS: 2
THP_ENCODER_N_LAYERS: 1
THP_LOSS_MC_SAMPLES: 100
THP_LOSS_NLL_WEIGHT: 0.01
THP_PRED_LOSS_TIME_WT: 1.0e-06
THP_PRED_LOSS_TYPE_WT: 1.0
TIME_GRID_CUTS_DAYS:
- 8
- 31
- 91
- 181
- 366
- 913
- 1826
- 4275.08
USE_THP: false
# One event type (ADMIT_DAD) makes every event token identical, and under rope
# the event encoder then returns one fixed vector; the head leaves it out.
USE_EVENT_ENCODER: false
USE_THP_PRED_LOSS: true
VALUE_LADDER_P_MAX: 412051.0
VALUE_LADDER_P_MIN: 0.00138889

# ---- Evaluation (evaluate_finetuned_predictions.py) -------------------------
# Equal to part1_csc.yaml and part1_tabdh.yaml.

EVAL_HORIZONS_DAYS: [7, 30, 90, 180, 365, 1095, 1825]

# The pinball loss's share of incidence to H (plan 2026-11-18; user,
# 2026-11-20).
PINBALL_Q: 0.25

CR_DCAL_ALPHA: 2
CR_DCAL_N_RHO: 1000
CR_DCAL_CHI2_BINS: 10
CR_DCAL_TEST_LEVEL: 0.05
