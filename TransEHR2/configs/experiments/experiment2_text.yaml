# Test experiment configuration for debugging

EXPERIMENT_NAME: "experiment2_text"

BATCH_SIZE: 200

# Whether to use pre-admission historical records. If False, historical
# timesteps are masked out at collation time so the model only sees
# episode data. Requires data extracted with left-padded history layout.
USE_HISTORICAL_RECORDS: True

# Whether to let the generator and discriminator predict feature presence indicators as well as values
PREDICT_INDICATORS: False

GENERATOR_ENCODER_D_MODEL: 256
GENERATOR_ENCODER_N_HEADS: 2
GENERATOR_ENCODER_N_ENCODER_BLOCKS: 1
GENERATOR_ENCODER_DIM_FEEDFORWARD: 256
GENERATOR_ENCODER_DROPOUT: 0.1
GENERATOR_ENCODER_ACTIVATION: 'gelu'
GENERATOR_ENCODER_NORM: 'LayerNorm'
GENERATOR_ENCODER_NORM_FIRST: True

DISCRIMINATOR_ENCODER_D_MODEL: 256
DISCRIMINATOR_ENCODER_N_HEADS: 2
DISCRIMINATOR_ENCODER_N_ENCODER_BLOCKS: 1
DISCRIMINATOR_ENCODER_DIM_FEEDFORWARD: 256
DISCRIMINATOR_ENCODER_DROPOUT: 0.1
DISCRIMINATOR_ENCODER_ACTIVATION: 'gelu'
DISCRIMINATOR_ENCODER_NORM: 'LayerNorm'
DISCRIMINATOR_ENCODER_NORM_FIRST: True

THP_ENCODER_D_MODEL: 256
THP_ENCODER_D_INNER: 256
THP_ENCODER_N_LAYERS: 1
THP_ENCODER_N_HEADS: 2
THP_ENCODER_D_K: 128  # = d_model/2, so RoPE gets n_head*d_k/2 = 128 bands, matching TPE
                      # d_v stays 64: only q and k are rotated, so only their width sets the ladder
THP_ENCODER_D_V: 64
THP_ENCODER_DROPOUT: 0.1
THP_ENCODER_NORM_FIRST: True

# ---- Temporal encoding arm --------------------------------------------------
#
# 'additive' adds TemporalPositionEncoding to the embedding, as submitted.
# 'rope' rotates the same ladder into q and k instead, so the attention score
# between two records depends on the gap between them rather than on how many
# records separate them. Both arms span one ladder, which is what lets them
# share a hyperparameter grid.
POSITION_ENCODING: 'additive'

# The ladder's bounds, in DAYS -- not hours. Timestamps are stored as int32
# minutes and divided by 1440 at __getitem__, so the MIMIC fork's constants
# would be out by a factor of 24.
#
# Measured by scripts/measure_ladder_bounds.py over the extracted arrays:
# P_MIN = 2 x shortest observed gap, P_MAX = 20*pi x longest observed span.
# The value stream spans 18.0 y at most (median 7.8 y) with a 1-minute
# resolution floor; the event stream 16.6 y, and only half the episodes carry
# an ADMIT_DAD record at all. Re-measure after any re-extraction: a bound
# carried over from a different draw is wrong in silence.
VALUE_LADDER_P_MIN: 0.00138889
VALUE_LADDER_P_MAX: 412357.0
EVENT_LADDER_P_MIN: 0.0680556
EVENT_LADDER_P_MAX: 379993.0

GENERATOR_D_MODEL: 256
GENERATOR_DIM_FEEDFORWARD: 256

DISCRIMINATOR_DIM_FEEDFORWARD: 256

PREDICTOR_AGGREGATION_METHOD: "mean"

MODEL_DIR: "/uhome/pr3/projects/p60290_2/TransEHR2/models"

PRETRAIN_LEARNING_RATE: 0.002
PRETRAIN_LR_HALF_LIFE: 329
PRETRAIN_TOTAL_EPOCH: 1000

DISC_LOSS_WEIGHT: 1.0
THP_LOSS_NLL_WEIGHT: 0.01
THP_LOSS_MC_SAMPLES: 100
# Whether the Transformer Hawkes process takes part in pretraining. Its
# log-likelihood integrates an intensity over inter-event gaps, so a broad
# dynamic range of timestamps makes it diverge; no reweighting fixes that,
# because it is the form of the loss rather than its scale. False removes
# the module, drops its term from the objective, and leaves the event
# encoder unpretrained -- the classifier still reads the event stream, and
# trains that encoder during finetuning instead.
USE_THP: False
USE_THP_PRED_LOSS: True
THP_PRED_LOSS_TYPE_WT: 1.0
THP_PRED_LOSS_TIME_WT: 0.000001

RECORD_MASK_RATIO: 0.15
OBS_UNOBS_SAMPLE_RATIO: 5.0
CMPNT_MASK_RATIO: 0.25

FINETUNE_LEARNING_RATE: 0.0002
FINETUNE_TOTAL_EPOCH: 500
FINETUNE_LR_HALF_LIFE: 132

# ---- Competing risks (DeepHit) ----------------------------------------------
#
# Unplanned readmission and death are fitted jointly, as competing causes:
# a patient who dies cannot be readmitted, so scoring the two separately
# would describe a cohort that does not exist.

# The right edges of the discrete time bins, in days: the sextiles of
# observed readmission time over the drawn episodes, from
# ``scripts/time_grid_cuts.py --step 0.1666666666666667`` (25,655
# readmissions, 4,276 or 4,275 in each bin by construction). Quantile cuts
# rather than round numbers because a bin with no events in it contributes
# a softmax slot and nothing else.
#
# The last cut is the largest observed readmission time, so it is the
# horizon rather than a choice: an event at or beyond it is an episode
# observed through the whole grid without one, which ``discretize()``
# enforces by taking ``t < horizon`` strictly. BRIER_INTEGRATION_DAYS must
# not exceed it.
#
# Note that no cut falls at one year. The integrated Brier score reaches
# 365 days by interpolating inside the 178.67--435.09 bin, which the
# monotone cubic fill below is there to make legitimate.
TIME_GRID_CUTS_DAYS: [46.45, 178.67, 435.09, 898.92, 1736.54, 6454.83]

# Which EVENT_TYPEs the model treats as competing causes, in output order.
# Anything absent is censoring, so dropping "out_migration" here gives the
# two-cause arm without a code change.
#
# Out-migration is a cause rather than censoring because leaving the province
# is a period of missing data, not the end of the record, and this data is
# already incomplete -- it holds no trace of most of a patient's contacts
# with the health system. Treating a departure as censoring would assume it
# says nothing about readmission risk. IBDdataprep races it against
# readmission and death per episode (see build_labels.py).
MODELLED_CAUSES: ["readmission", "death", "out_migration"]

# Weight on DeepHit's ranking term. The likelihood alone is indifferent to
# whether the patient who failed carried the higher risk; 0 is the
# ablation that says so.
DEEPHIT_RANK_WEIGHT: 1.0

# Scale of the ranking term's exponential. Smaller punishes a mis-ordered
# pair more sharply and saturates sooner.
DEEPHIT_SIGMA: 0.1

# Per-cause weight inside the ranking term, in cause order
# (readmission, death). Raising the rarer cause buys its ordering at the
# other's expense; it does not touch the likelihood. null means equal.
DEEPHIT_CAUSE_WEIGHTS: null

# The head: one shared stack, then one per cause, each also seeing the raw
# encoding. One entry per hidden layer, so these lists set the depth as well
# as the width -- Lee et al. fix the head's shape but search its depth, and
# two layers each is the starting point rather than a published value.
#
# The cause-specific stacks are per cause: each of the three causes gets its
# own parameters at these widths.
DEEPHIT_HEAD_D_SHARED: [256, 128]
DEEPHIT_HEAD_D_CAUSE: [128, 64]
DEEPHIT_HEAD_DROPOUT: 0.1

# Which validation number picks the finetuned epoch. 'brier' minimizes the
# integrated Brier score for readmission alone; 'cindex' maximizes the mean
# cause-specific time-dependent concordance; 'loss' minimizes the DeepHit
# objective. They disagree: the ranking term rewards ordering the cohort,
# the likelihood rewards calibrating it.
#
# 'brier' because it is the only one of the three that scores the question
# this study asks. A run that orders deaths well and readmissions poorly
# looks good on 'cindex', and neither of the others names a horizon.
#
# This is model selection only. The objective the run trains against is
# DeepHit's published all-cause default and is not affected.
FINETUNE_SELECTION_METRIC: "brier"

# How far the integrated Brier score reaches, in days. The lower limit is
# always discharge. One year reflects the intended use and the limits of
# the distant future: the model is meant to be re-run whenever the patient
# sees a physician, a patient is expected to see one at least annually, and
# outcomes further out are hard to predict regardless (development/notes.md).
#
# Between the cuts the cumulative incidence is filled in with a monotone
# cubic spline (Hyman filtering), so this bound is free of the grid: it can
# be any number of days out to the last cut, whether or not a cut falls
# there. The spline is part of the predictor, not of the scoring -- the
# reported curves are read off it too.
BRIER_INTEGRATION_DAYS: 365
