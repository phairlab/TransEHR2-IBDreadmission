# Base config for phase 1: the pretraining schedule sweep.
#
# The shipped baseline at the tuning epoch budget. PRETRAIN_LEARNING_RATE and
# PRETRAIN_LR_HALF_LIFE are present but are overwritten per trial by
# generate_tuning_configs.py -- the spec's GRID owns them.
#
# PRETRAIN_TOTAL_EPOCH is 200 against the 1000 a final run uses. Every
# decision record taken from this phase has to say so: the schedule is
# selected under a budget it will not be applied at, and the decay is the
# hyperparameter most sensitive to run length.
#
# Seeds are pinned so that trials differ by the grid and nothing else. The
# cost is that a margin between cells carries no error bar.
BATCH_SIZE: 200
BRIER_INTEGRATION_DAYS: 365
CMPNT_MASK_RATIO: 0.25
DEEPHIT_CAUSE_WEIGHTS: null
DEEPHIT_HEAD_DROPOUT: 0.1
DEEPHIT_HEAD_D_CAUSE:
- 128
- 64
DEEPHIT_HEAD_D_SHARED:
- 256
- 128
DEEPHIT_RANK_WEIGHT: 1.0
DEEPHIT_SIGMA: 0.1
DISCRIMINATOR_DIM_FEEDFORWARD: 256
DISCRIMINATOR_ENCODER_ACTIVATION: gelu
DISCRIMINATOR_ENCODER_DIM_FEEDFORWARD: 256
DISCRIMINATOR_ENCODER_DROPOUT: 0.1
DISCRIMINATOR_ENCODER_D_MODEL: 256
DISCRIMINATOR_ENCODER_NORM: LayerNorm
DISCRIMINATOR_ENCODER_NORM_FIRST: true
DISCRIMINATOR_ENCODER_N_ENCODER_BLOCKS: 1
DISCRIMINATOR_ENCODER_N_HEADS: 2
DISC_LOSS_WEIGHT: 1.0
EVENT_LADDER_P_MAX: 379993.0
EVENT_LADDER_P_MIN: 0.0680556
EXPERIMENT_NAME: phase1_centre
FINETUNE_LEARNING_RATE: 0.0002
FINETUNE_LR_HALF_LIFE: 132
FINETUNE_SEED: 0
FINETUNE_SELECTION_METRIC: brier
FINETUNE_TOTAL_EPOCH: 500
GENERATOR_DIM_FEEDFORWARD: 256
GENERATOR_D_MODEL: 256
GENERATOR_ENCODER_ACTIVATION: gelu
GENERATOR_ENCODER_DIM_FEEDFORWARD: 256
GENERATOR_ENCODER_DROPOUT: 0.1
